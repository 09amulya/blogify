<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Blogify</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">Blogify</div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p>
                Login to continue to Blogify
            </p>

        </div>


        <form id="loginForm">

            <div class="input-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="full-btn">

                Login

            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
