<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Blogify</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Blogify
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="create-blog.html">
            Create Blog
        </a>

        <button
            id="dashboardLogout"
            class="logout-btn">

            Logout

        </button>

    </nav>

</header>


<main class="dashboard">

    <section class="dashboard-header">

        <div>

            <span class="small-heading">
                DASHBOARD
            </span>

            <h1>
                Welcome, <span id="userName">User</span> 👋
            </h1>

            <p>
                Manage your blogs and track your activity.
            </p>

        </div>


        <a
            href="create-blog.html"
            class="btn">

            + Create Blog

        </a>

    </section>


    <!-- Statistics -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                📝
            </div>

            <div>

                <h3 id="postCount">
                    0
                </h3>

                <p>
                    Total Posts
                </p>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                👁️
            </div>

            <div>

                <h3 id="viewCount">
                    0
                </h3>

                <p>
                    Total Views
                </p>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ❤️
            </div>

            <div>

                <h3 id="likeCount">
                    0
                </h3>

                <p>
                    Total Likes
                </p>

            </div>

        </div>

    </section>


    <!-- User Blogs -->

    <section class="dashboard-blogs">

        <div class="section-heading left">

            <span class="small-heading">
                YOUR CONTENT
            </span>

            <h2>
                Your Blogs
            </h2>

        </div>


        <div
            id="dashboardBlogContainer"
            class="blog-container">

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
